<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0a1230">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Biblioteca">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 46'%3E%3Cpath d='M20 2 37 8v14c0 11-7.5 18.5-17 22C10.5 40.5 3 33 3 22V8z' fill='%232449b0' stroke='%23d4af37' stroke-width='3'/%3E%3Cpath d='M10 17c3.5-1.2 7-1 10 1.2 3-2.2 6.5-2.4 10-1.2v13c-3.5-1.2-7-1-10 1.2-3-2.2-6.5-2.4-10-1.2z' fill='none' stroke='%23d4af37' stroke-width='2'/%3E%3C/svg%3E">
<title>Mi Biblioteca</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a1230;--surface:#121d45;--surface-2:#1b2a5e;--primary:#2449b0;--accent:#d4af37;
  --text:#f4eedb;--muted:#9fa9cf;--wall:#0c1636;--shelf-1:#5b3a22;--shelf-2:#3a2414;
  --on-accent:#1b1408;--on-primary:#fff;
  --line:color-mix(in srgb,var(--accent) 22%,transparent);
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg);color:var(--text);font-family:'EB Garamond',Georgia,serif;font-size:17px;min-height:100vh;line-height:1.45;
  background-image:radial-gradient(1100px 600px at 5% -10%,color-mix(in srgb,var(--primary) 32%,transparent),transparent 60%),
                   radial-gradient(900px 500px at 105% 0%,color-mix(in srgb,var(--accent) 9%,transparent),transparent 60%);
  background-attachment:fixed;
}
h1,h2,h3,.cinzel{font-family:'Cinzel',Georgia,serif;letter-spacing:.04em;font-weight:500}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
input,select,textarea{font:inherit;font-size:16px;color:var(--text);background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 20%,transparent)}
textarea{resize:vertical}
input[type=color]{padding:2px;width:42px;height:32px;cursor:pointer}
.ic{width:18px;height:18px;flex:none}
.muted{color:var(--muted)}
.hint{font-size:14px;color:var(--muted);margin:6px 0}
.hint.ok{color:var(--accent)}
.row{display:flex;gap:8px;align-items:center}
.row.wrap{flex-wrap:wrap}
::-webkit-scrollbar{height:8px;width:8px}
::-webkit-scrollbar-thumb{background:color-mix(in srgb,var(--accent) 35%,transparent);border-radius:9px}
::-webkit-scrollbar-track{background:transparent}

/* ---------- Barra superior ---------- */
.topbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.tb-in{max-width:1400px;margin:auto;padding:12px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand h1{font-size:22px;margin:0;color:var(--accent);white-space:nowrap;font-weight:700}
.tabs{display:flex;gap:4px;background:var(--surface);padding:4px;border-radius:999px;border:1px solid var(--line)}
.tab{border:0;background:none;padding:6px 14px;border-radius:999px;display:flex;gap:6px;align-items:center;color:var(--muted)}
.tab.on{background:var(--primary);color:var(--on-primary)}
.spacer{flex:1}
.search{position:relative;width:250px}
.search .ic{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search input{padding-left:34px;border-radius:999px;background:var(--surface)}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:999px;display:inline-flex;align-items:center;gap:6px;text-decoration:none;white-space:nowrap;transition:filter .15s,transform .15s}
.btn:hover{filter:brightness(1.15)}
.btn.gold{background:linear-gradient(180deg,var(--accent),color-mix(in srgb,var(--accent) 72%,#000));color:var(--on-accent);border-color:transparent;font-weight:600}
.btn.danger{color:#ff9a9a;border-color:#ff9a9a55}
.btn.sm{padding:5px 11px;font-size:15px}
.icon-btn{width:38px;height:38px;padding:0;justify-content:center;border-radius:50%}
.icon-btn.sm{width:32px;height:32px}
.cloud-ok{color:var(--accent)}
.cloud-busy{color:var(--muted);animation:pulse 1.2s ease-in-out infinite}
.cloud-err{color:#ff9a9a;border-color:#ff9a9a88}
@keyframes pulse{50%{opacity:.4}}
.filters{max-width:1400px;margin:auto;padding:0 20px 12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filters select{width:auto;border-radius:999px;padding:4px 12px;font-size:15px;background:var(--surface)}
.chip{border:1px solid var(--line);background:transparent;padding:4px 12px;border-radius:999px;font-size:15px;color:var(--muted);display:inline-flex;gap:6px;align-items:center}
.chip .ic{width:15px;height:15px}
.chip.on{background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--text);border-color:var(--accent)}
.chip .dot{width:8px;height:8px;border-radius:50%}
.chip .n{font-size:13px;opacity:.7}
main{max-width:1400px;margin:auto;padding:22px 20px 60px}
.section-t{font-family:'Cinzel',serif;font-size:15px;color:var(--accent);letter-spacing:.16em;text-transform:uppercase;display:flex;align-items:center;gap:12px;margin:0 0 12px}
.section-t::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}

/* ---------- Leyendo ahora ---------- */
.reading{display:flex;gap:14px;overflow-x:auto;padding:2px 2px 16px;margin-bottom:14px}
.rcard{display:flex;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px 10px 10px;min-width:290px;max-width:340px;cursor:pointer;text-align:left;transition:transform .2s}
.rcard:hover{transform:translateY(-3px)}
.rcard .thumb{width:54px;height:80px;flex:none}
.rcard b{font-size:16px;display:block;line-height:1.2}
.rcard .a{font-size:14px;color:var(--muted)}
.progress{height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden;margin-top:8px}
.progress>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),color-mix(in srgb,var(--accent) 60%,#fff))}
.pct{font-size:13px;color:var(--muted);margin-top:3px}

/* ---------- Estantería ---------- */
.case{background:linear-gradient(90deg,rgba(0,0,0,.25),rgba(255,255,255,.04) 50%,rgba(0,0,0,.25)),linear-gradient(180deg,var(--shelf-1),var(--shelf-2));padding:16px 16px 4px;border-radius:10px;box-shadow:0 30px 60px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.12)}
.shelf{background:linear-gradient(180deg,rgba(0,0,0,.5),rgba(0,0,0,.12) 35%,rgba(0,0,0,.28)),var(--wall);position:relative;margin-bottom:14px;border-radius:3px;box-shadow:inset 0 12px 24px rgba(0,0,0,.55),inset 0 -2px 6px rgba(0,0,0,.4)}
.shelf-head{display:flex;align-items:center;gap:8px;padding:10px 14px 0;position:relative;z-index:3}
.plaque{font-family:'Cinzel',serif;font-size:12px;letter-spacing:.14em;text-transform:uppercase;background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 70%,#fff),var(--accent) 45%,color-mix(in srgb,var(--accent) 65%,#000));color:var(--on-accent);border:0;padding:3px 12px;border-radius:3px;box-shadow:0 2px 4px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.4);font-weight:700}
.shelf-head .count{font-size:13px;color:color-mix(in srgb,var(--text) 60%,transparent)}
.shelf-tools{margin-left:auto;display:flex;gap:4px;opacity:0;transition:opacity .2s}
.shelf:hover .shelf-tools{opacity:1}
@media (hover:none){.shelf-tools{opacity:1}}
.tool{border:1px solid rgba(255,255,255,.15);background:rgba(0,0,0,.35);color:#f3ead2;border-radius:6px;width:30px;height:28px;display:grid;place-items:center;padding:0}
.tool .ic{width:15px;height:15px}
.tool:hover{border-color:var(--accent);color:var(--accent)}
.shelf-row{display:flex;align-items:flex-end;gap:3px;min-height:250px;padding:22px 20px 0;overflow-x:auto;overflow-y:hidden;transition:background .2s}
.shelf-row.drop-hover{background:color-mix(in srgb,var(--accent) 10%,transparent)}
.plank{height:16px;background:linear-gradient(180deg,color-mix(in srgb,var(--shelf-1) 75%,#fff),var(--shelf-1) 35%,var(--shelf-2));box-shadow:0 7px 10px rgba(0,0,0,.45);position:relative;z-index:2}
.empty-shelf{align-self:center;margin:auto;color:color-mix(in srgb,var(--text) 45%,transparent);font-style:italic;border:1px dashed color-mix(in srgb,var(--text) 25%,transparent);padding:12px 22px;border-radius:8px}
.add-shelf{margin:18px auto 0;display:flex}

/* ---------- Libros ---------- */
.book{position:relative;flex:none;cursor:pointer;transition:transform .25s ease,opacity .3s,filter .3s}
.book.spine-mode:hover{transform:translateY(-10px)}
.book.cover-mode{width:var(--w);height:var(--h);margin:0 6px}
.book.cover-mode:hover{transform:translateY(-6px) scale(1.03)}
.book.flat:hover{transform:translateX(7px)}
.book.dragging{opacity:.3}
.book.dim{opacity:.16;filter:grayscale(1)}
.spine{width:var(--w);height:var(--h);background-color:var(--c);color:var(--tc);border-radius:3px 3px 2px 2px;
  background-image:linear-gradient(90deg,rgba(0,0,0,.38),rgba(255,255,255,.14) 16%,rgba(255,255,255,0) 34%,rgba(0,0,0,.08) 70%,rgba(0,0,0,.42));
  background-size:cover;background-position:center;
  box-shadow:2px 0 4px rgba(0,0,0,.45);display:flex;flex-direction:column;align-items:center;padding:16px 0 14px;overflow:hidden;position:relative}
.spine::before,.spine::after{content:'';position:absolute;left:3px;right:3px;height:4px;border-top:1px solid var(--accent);border-bottom:1px solid var(--accent);opacity:.9}
.spine::before{top:7px}.spine::after{bottom:7px}
.sp-t,.sp-a{writing-mode:vertical-rl;transform:rotate(180deg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sp-t{font-family:'Cinzel',serif;font-weight:700;font-size:clamp(9px,calc(var(--w) * .42),15px);flex:1;min-height:0;text-align:center;letter-spacing:.03em}
.sp-a{font-size:clamp(8px,calc(var(--w) * .3),11px);opacity:.82;max-height:38%;margin-top:6px;font-style:italic}
.spine.has-img{box-shadow:2px 0 4px rgba(0,0,0,.45),inset 3px 0 5px rgba(255,255,255,.1),inset -3px 0 6px rgba(0,0,0,.35)}
.spine.has-img::before,.spine.has-img::after,.spine.has-img>span{display:none}
.cover-mode img,.cover-mode .gen-cover{width:100%;height:100%;object-fit:cover;border-radius:2px 5px 5px 2px;box-shadow:3px 5px 12px rgba(0,0,0,.55);display:block}
.cover-mode::after{content:'';position:absolute;top:0;bottom:0;left:0;width:9px;background:linear-gradient(90deg,rgba(0,0,0,.35),rgba(255,255,255,.18),transparent);border-radius:2px 0 0 2px;pointer-events:none}
.gen-cover{background:radial-gradient(circle at 30% 20%,rgba(255,255,255,.16),transparent 60%),var(--c);color:var(--tc);padding:8px;display:flex;border-radius:2px 5px 5px 2px;width:100%;height:100%}
.gc-frame{border:1px solid var(--accent);outline:1px solid color-mix(in srgb,var(--accent) 60%,transparent);outline-offset:-5px;flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:8px;gap:6px;overflow:hidden}
.gc-t{font-family:'Cinzel',serif;font-size:13px;line-height:1.2;font-weight:700}
.gc-a{font-size:11px;font-style:italic;opacity:.85}
.gen-cover.big .gc-t{font-size:22px}.gen-cover.big .gc-a{font-size:16px}
.stack{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;flex:none;margin:0 8px}
.flat{width:var(--h);height:var(--w);position:relative}
.flat .spine{position:absolute;left:50%;top:50%;width:var(--w);height:var(--h);transform:translate(-50%,-50%) rotate(90deg);box-shadow:-2px 0 3px rgba(0,0,0,.4)}
.fmt{position:absolute;z-index:2;width:19px;height:19px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;box-shadow:0 1px 4px rgba(0,0,0,.6)}
.fmt .ic{width:11px;height:11px}
.spine-mode .fmt{left:50%;transform:translateX(-50%);bottom:17px}
.cover-mode .fmt{top:6px;right:6px;width:22px;height:22px}
.flat .fmt{right:16px;top:50%;transform:translateY(-50%)}
.ribbon{position:absolute;top:-14px;left:calc(50% - 4px);width:8px;height:15px;background:var(--accent);clip-path:polygon(0 0,50% 30%,100% 0,100% 100%,0 100%)}
.cover-mode .ribbon{left:auto;right:18px}
.st-desterrado .spine,.st-desterrado img,.st-desterrado .gen-cover{filter:grayscale(.85) brightness(.7)}

/* ---------- Lista ---------- */
.list-tools{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.list-tools select{width:auto}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}
.lcard{display:flex;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;text-align:left;transition:transform .2s,border-color .2s}
.lcard:hover{transform:translateY(-2px);border-color:var(--accent)}
.lc-cover{width:72px;height:108px;flex:none;position:relative}
.lc-cover img,.lc-cover .gen-cover,.thumb img,.thumb .gen-cover{width:100%;height:100%;object-fit:cover;border-radius:3px;box-shadow:2px 3px 8px rgba(0,0,0,.4)}
.thumb .gen-cover .gc-t,.lc-cover .gen-cover .gc-t{font-size:9px}
.thumb .gen-cover .gc-a,.lc-cover .gen-cover .gc-a{display:none}
.lc-body{min-width:0;display:flex;flex-direction:column;gap:4px}
.lc-body b{font-size:17px;line-height:1.2}
.lc-body .a{color:var(--muted);font-size:15px}
.lc-money{font-size:14px;color:var(--muted)}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:13px;padding:1px 9px;border-radius:99px;background:color-mix(in srgb,var(--pc) 22%,transparent);border:1px solid color-mix(in srgb,var(--pc) 55%,transparent)}
.pill .ic{width:13px;height:13px}

/* ---------- Estrellas ---------- */
.stars{display:inline-flex;gap:1px;font-size:20px;line-height:1;vertical-align:middle}
.star{position:relative;color:color-mix(in srgb,var(--muted) 45%,transparent)}
.star::before{content:'★';position:absolute;left:0;top:0;width:var(--f);overflow:hidden;color:var(--accent)}
.stars.interactive{font-size:30px;cursor:pointer}
.stars.sm{font-size:15px}

/* ---------- Modal ---------- */
.modal-wrap{position:fixed;inset:0;background:rgba(0,0,0,.62);backdrop-filter:blur(4px);display:none;align-items:flex-start;justify-content:center;z-index:50;overflow-y:auto;padding:40px 16px}
.modal-wrap.open{display:flex}
.modal-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;width:100%;max-width:640px;padding:26px;position:relative;box-shadow:0 30px 80px rgba(0,0,0,.6);animation:pop .2s ease}
.modal-card.wide{max-width:960px}
@keyframes pop{from{transform:translateY(10px);opacity:0}}
.x{position:absolute;top:14px;right:14px}
.m-title{margin:0 0 16px;color:var(--accent);font-size:24px}
.d-label{font-family:'Cinzel',serif;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin:16px 0 8px}
.detail{display:grid;grid-template-columns:240px 1fr;gap:28px}
.d-cover{width:240px;height:360px;position:relative}
.d-cover img,.d-cover .gen-cover{width:100%;height:100%;object-fit:cover;border-radius:3px 7px 7px 3px;box-shadow:6px 10px 24px rgba(0,0,0,.55)}
.d-title{margin:0;font-size:28px;line-height:1.15;padding-right:40px}
.d-author{font-size:20px;color:var(--muted);font-style:italic;margin:4px 0 12px}
.d-rating{display:flex;align-items:center;gap:10px;margin:12px 0}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.money{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-top:16px}
.tile{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.tile small{display:block;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;font-family:'Cinzel',serif}
.tile b{font-size:22px;font-weight:600}
.tile b.good{color:#7fd39b}.tile b.bad{color:#ff9a9a}
.prose{white-space:pre-wrap;margin:0}
.prose.review{font-style:italic;border-left:3px solid var(--accent);padding-left:12px}
.meta{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;margin:8px 0 0;font-size:15px}
.meta dt{color:var(--muted)}.meta dd{margin:0}
.d-actions,.m-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:22px;flex-wrap:wrap}
.d-left select{flex:1}
.prog-row{display:flex;align-items:center;gap:10px;margin-top:12px}
.prog-row input{width:90px}
.prog-row .progress{flex:1;margin:0}

/* ---------- Formulario ---------- */
.online-box{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:8px}
.online-row{display:flex;gap:8px}
.online-row input{background:var(--surface)}
.results{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;max-height:380px;overflow:auto;margin-top:12px;padding:2px}
.res{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px;text-align:left;display:flex;flex-direction:column;gap:3px;transition:border-color .2s}
.res:hover{border-color:var(--accent)}
.res img,.res .noimg{width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:4px;background:var(--bg);display:grid;place-items:center;font-size:13px;color:var(--muted)}
.res b{font-size:14px;line-height:1.2}
.res span{font-size:13px;color:var(--muted)}
.res small{font-size:12px;color:var(--muted)}
.res em{color:var(--accent);font-style:normal}
.loading{padding:16px;color:var(--muted);font-style:italic}
.form{display:grid;grid-template-columns:250px 1fr;gap:26px}
.f-images{display:flex;flex-direction:column;gap:6px}
.f-img-block{display:flex;flex-direction:column;gap:8px}
.f-cover{width:180px;height:270px;position:relative}
.f-cover img,.f-cover .gen-cover{width:100%;height:100%;object-fit:cover;border-radius:3px 6px 6px 3px;box-shadow:4px 6px 16px rgba(0,0,0,.5)}
.f-spine{height:200px;display:flex;align-items:flex-end}
.covers{display:flex;gap:6px;flex-wrap:wrap}
.covers img{width:50px;height:75px;object-fit:cover;border-radius:3px;border:2px solid transparent;cursor:pointer;opacity:.75}
.covers img.sel{border-color:var(--accent);opacity:1}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.grid2 .full{grid-column:1/-1}
label{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--muted)}
.color-l{flex-direction:row;align-items:center;gap:8px;color:var(--text);font-size:15px}
.f-fields label{margin-top:2px}
.f-fields>label{margin-top:12px}

/* ---------- Ajustes ---------- */
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.tcard{border:2px solid var(--line);border-radius:12px;padding:10px 12px;text-align:left;display:flex;flex-direction:column;gap:8px}
.tcard.on{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
.sw{display:flex}
.sw i{width:22px;height:22px;border-radius:50%;border:2px solid rgba(255,255,255,.25);margin-right:-6px}
.colors{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin-top:10px}
details summary{cursor:pointer;color:var(--muted);margin-top:10px}
.shelf-list{display:flex;flex-direction:column;gap:8px}
.shelf-list .muted{font-size:14px;white-space:nowrap}

/* ---------- Estadísticas ---------- */
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px;margin-bottom:26px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.stat small{font-family:'Cinzel',serif;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.stat b{display:block;font-size:32px;font-weight:600;color:var(--accent);line-height:1.2;margin-top:4px}
.stat span{font-size:14px;color:var(--muted)}
.panels{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
.bar{display:grid;grid-template-columns:110px 1fr 36px;gap:10px;align-items:center;margin:9px 0;font-size:15px}
.bar .track{height:10px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.bar .track i{display:block;height:100%;border-radius:99px}
.toplist{margin:0;padding:0;list-style:none}
.toplist li{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);cursor:pointer}
.toplist li:last-child{border:0}

/* ---------- Bienvenida / toast ---------- */
.welcome{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:28px;text-align:center;margin-bottom:20px}
.welcome h2{color:var(--accent);margin:0 0 6px}
.welcome .row{justify-content:center;margin-top:16px;flex-wrap:wrap}
.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,30px);background:var(--surface-2);border:1px solid var(--accent);padding:10px 20px;border-radius:999px;opacity:0;transition:.3s;z-index:90;pointer-events:none;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.genres{margin-bottom:8px}
.genres .chip{font-size:14px;padding:3px 10px}
.bgtask{position:fixed;left:16px;bottom:76px;z-index:80;background:var(--surface-2);border:1px solid var(--accent);color:var(--text);padding:8px 16px;border-radius:999px;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.45);display:flex;gap:10px;align-items:center;max-width:calc(100vw - 32px)}
.bgtask[hidden]{display:none}
.bgtask .ic{width:16px;height:16px;color:var(--accent);animation:pulse 1.2s ease-in-out infinite}
.imp-table{width:100%;border-collapse:collapse;font-size:14px;margin-top:8px}
.imp-table th,.imp-table td{text-align:left;padding:5px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.imp-table th{color:var(--accent);font-weight:normal}
.imp-wrap{overflow-x:auto}
.check-l{display:flex;flex-direction:row;gap:10px;align-items:center;margin-top:14px;cursor:pointer;font-size:15px;color:var(--text)}
.check-l input{width:18px;height:18px;padding:0;accent-color:var(--accent)}

@media (max-width:760px){
  .tb-in{padding:10px 16px;gap:10px}
  .brand h1{font-size:18px}
  .tab span{display:none}
  .search{order:5;width:100%}
  .filters{padding:0 16px 10px}
  main{padding:16px}
  .detail,.form{grid-template-columns:1fr}
  .d-cover{width:180px;height:270px;margin:auto}
  .modal-card{padding:20px 16px}
  .online-row{flex-direction:column}
  .lgrid{grid-template-columns:1fr}
  .case{padding:10px 8px 2px}
  .shelf-row{padding:22px 10px 0}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="tb-in">
    <div class="brand">
      <svg viewBox="0 0 40 46" width="32" height="37" aria-hidden="true"><path d="M20 2 37 8v14c0 11-7.5 18.5-17 22C10.5 40.5 3 33 3 22V8z" fill="var(--primary)" stroke="var(--accent)" stroke-width="2"/><path d="M10 17c3.5-1.2 7-1 10 1.2 3-2.2 6.5-2.4 10-1.2v13c-3.5-1.2-7-1-10 1.2-3-2.2-6.5-2.4-10-1.2z" fill="none" stroke="var(--accent)" stroke-width="1.6"/><path d="M20 18v13" stroke="var(--accent)" stroke-width="1.4"/><circle cx="20" cy="10" r="1.6" fill="var(--accent)"/></svg>
      <h1 id="libTitle">Mi Biblioteca</h1>
    </div>
    <nav class="tabs" id="tabs"></nav>
    <div class="spacer"></div>
    <div class="search"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg><input id="q" type="search" placeholder="Buscar en mi biblioteca…" autocomplete="off"></div>
    <button class="btn gold" data-act="add-book" id="addBtn"></button>
    <button class="btn icon-btn" data-act="settings" id="cloudBtn" hidden></button>
    <button class="btn icon-btn" data-act="settings" title="Personalizar" id="setBtn"></button>
  </div>
  <div class="filters" id="filters"></div>
</header>
<main id="main"></main>
<div class="modal-wrap" id="modalWrap"><div id="modal"></div></div>
<div class="toast" id="toast"></div>
<input type="file" id="fileIn" accept="image/*" hidden>
<input type="file" id="jsonIn" accept="application/json,.json" hidden>
<input type="file" id="xlsIn" accept=".xlsx,.xls,.xlsm,.ods,.csv" hidden>
<div class="bgtask" id="bgTask" hidden></div>

<script>
/* ================= Utilidades ================= */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const num=v=>{if(v===''||v==null)return null;const x=parseFloat(String(v).replace(',','.'));return isNaN(x)?null:x};
const eur=v=>v==null?'—':new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR'}).format(v);
const today=()=>new Date().toISOString().slice(0,10);
const fmtDate=d=>d?new Date(d+(d.length===10?'T12:00':'')).toLocaleDateString('es-ES',{day:'numeric',month:'short',year:'numeric'}):'';
function hash(s){let h=2166136261;for(const c of String(s))h=Math.imul(h^c.charCodeAt(0),16777619);return h>>>0}
const SPINE_PALETTE=['#1d3a6e','#7a1f2b','#2f5d3a','#5b3a6e','#8a5a1c','#22404a','#6b2d1f','#3b3f58','#7d6a2e','#1f4f5f','#4a2c2a','#2c2c34','#0f5257','#8c3b4a','#c9b48a','#e2d6c0'];
const hashColor=s=>SPINE_PALETTE[hash(s)%SPINE_PALETTE.length];
function hexRgb(h){h=String(h||'#000').replace('#','');if(h.length===3)h=[...h].map(c=>c+c).join('');const n=parseInt(h,16)||0;return[(n>>16)&255,(n>>8)&255,n&255]}
function lum(h){const[r,g,b]=hexRgb(h).map(v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)});return .2126*r+.7152*g+.0722*b}
const textOn=h=>lum(h)>.36?'#1b1408':'#f6ecd2';
const rgbHex=(r,g,b)=>'#'+[r,g,b].map(v=>Math.round(v).toString(16).padStart(2,'0')).join('');

const I={
  shelf:'<path d="M4 3v18M20 3v18M4 21h16M4 12h16"/><path d="M7 12V6M10 12V7M14 21v-6l3 1v5"/>',
  list:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
  chart:'<path d="M3 3v18h18"/><path d="M7 16v-5M12 16V8M17 16v-8"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  palette:'<circle cx="13.5" cy="6.5" r="1.3"/><circle cx="17.5" cy="10.5" r="1.3"/><circle cx="8.5" cy="7.5" r="1.3"/><circle cx="6.5" cy="12.5" r="1.3"/><path d="M12 2a10 10 0 0 0 0 20c1.1 0 2-.9 2-2 0-.5-.2-1-.5-1.3-.3-.4-.5-.8-.5-1.3 0-1.1.9-2 2-2h2.3A5.7 5.7 0 0 0 22 9.7C22 5.4 17.5 2 12 2z"/>',
  search:'<circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/>',
  tablet:'<rect x="5" y="2" width="14" height="20" rx="2"/><path d="M11 18h2"/>',
  audio:'<path d="M3 14v-2a9 9 0 0 1 18 0v2"/><path d="M21 15a2 2 0 0 1-2 2h-1v-6h1a2 2 0 0 1 2 2zM3 15a2 2 0 0 0 2 2h1v-6H5a2 2 0 0 0-2 2z"/>',
  heart:'<path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/>',
  book:'<path d="M2 4h6a4 4 0 0 1 4 4v13a3 3 0 0 0-3-3H2zM22 4h-6a4 4 0 0 0-4 4v13a3 3 0 0 1 3-3h7z"/>',
  bookmark:'<path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>',
  check:'<path d="M20 6 9 17l-5-5"/>',
  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  ban:'<circle cx="12" cy="12" r="9"/><path d="m5.7 5.7 12.6 12.6"/>',
  edit:'<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',
  trash:'<path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/>',
  upload:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/>',
  download:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/>',
  x:'<path d="M18 6 6 18M6 6l12 12"/>',
  left:'<path d="m15 18-6-6 6-6"/>',right:'<path d="m9 18 6-6-6-6"/>',
  spine:'<rect x="9" y="3" width="6" height="18" rx="1"/><path d="M9 7h6M9 17h6"/>',
  cover:'<rect x="5" y="3" width="14" height="18" rx="1"/><path d="M9 8h6M9 11h4"/>',
  stack:'<rect x="3" y="16" width="18" height="5" rx="1"/><rect x="5" y="10" width="15" height="5" rx="1"/><rect x="4" y="4" width="16" height="5" rx="1"/>',
  external:'<path d="M15 3h6v6M10 14 21 3M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>',
  cloud:'<path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/>',
  wand:'<path d="M15 4V2M15 16v-2M8 9h2M20 9h2M17.8 11.8 19 13M17.8 6.2 19 5M12.2 6.2 11 5M3 21l9-9"/>',
};
const ic=(n,cls='')=>`<svg class="ic ${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${I[n]}</svg>`;

const STATUS={
  leyendo:{l:'Leyendo',c:'#4fa3ff',i:'bookmark'},
  pendiente:{l:'Pendiente',c:'#d4af37',i:'clock'},
  leido:{l:'Leído',c:'#4caf7a',i:'check'},
  desterrado:{l:'Desterrado',c:'#c46a6a',i:'ban'},
};
const FORMAT={
  fisico:{l:'Físico',i:'book'},
  ambos:{l:'Físico + digital',i:'book'},
  ebook:{l:'Ebook (digital)',i:'tablet'},
  audio:{l:'Audiolibro',i:'audio'},
  deseado:{l:'No lo tengo (deseado)',i:'heart'},
};
const DISPLAY={spine:{l:'Lomo',i:'spine'},cover:{l:'Portada',i:'cover'},flat:{l:'Apilado',i:'stack'}};
const isPhysical=b=>b.format==='fisico'||b.format==='ambos';
const GENRES=['Fantasía','Romántica','Romantasy','Ciencia ficción','Distopía','Thriller','Misterio','Policiaca','Terror','Histórica','Contemporánea','Clásico','Juvenil','Infantil','Poesía','Teatro','Ensayo','Biografía','Autoayuda','Cómic','Manga','Humor','Viajes','Cocina'];
const genresOf=s=>String(s||'').split(/\s*[,;]\s*/).map(x=>x.trim()).filter(Boolean);
function allGenres(){const seen=new Set(),out=[];for(const g of [...GENRES,...state.books.flatMap(b=>genresOf(b.genre))]){const k=norm(g);if(!seen.has(k)){seen.add(k);out.push(g)}}return out}
// categorías de Google Books (en inglés) → géneros en español
const GCAT={'fiction':'','juvenile fiction':'Juvenil','young adult fiction':'Juvenil','juvenile nonfiction':'Juvenil','fantasy':'Fantasía','science fiction':'Ciencia ficción','dystopian':'Distopía','romance':'Romántica','thrillers':'Thriller','suspense':'Thriller','mystery & detective':'Misterio','mystery':'Misterio','crime':'Policiaca','horror':'Terror','historical':'Histórica','history':'Histórica','classics':'Clásico','literary':'Contemporánea','poetry':'Poesía','drama':'Teatro','biography & autobiography':'Biografía','self-help':'Autoayuda','comics & graphic novels':'Cómic','manga':'Manga','humor':'Humor','travel':'Viajes','cooking':'Cocina','literary criticism':'Ensayo','philosophy':'Ensayo'};
function mapCats(cats){const out=[];for(const c of cats||[])for(const p of String(c).split('/')){const g=GCAT[p.trim().toLowerCase()];if(g&&!out.includes(g))out.push(g)}return out.join(', ')}

const THEMES={
  ravenclaw:{name:'Ravenclaw',bg:'#0a1230',surface:'#121d45',surface2:'#1b2a5e',primary:'#2449b0',accent:'#d4af37',text:'#f4eedb',muted:'#9fa9cf',wall:'#0c1636'},
  gryffindor:{name:'Gryffindor',bg:'#1c0709',surface:'#2c0e11',surface2:'#421619',primary:'#8b1a1a',accent:'#e0b23a',text:'#f6ead2',muted:'#c9a39a',wall:'#230a0c'},
  slytherin:{name:'Slytherin',bg:'#07160f',surface:'#0f2419',surface2:'#173525',primary:'#1f5c3a',accent:'#c8ccd2',text:'#e9f0ea',muted:'#93ab9c',wall:'#0a1c13'},
  hufflepuff:{name:'Hufflepuff',bg:'#17140d',surface:'#231e13',surface2:'#33291a',primary:'#6e5310',accent:'#f0c53e',text:'#f7eed6',muted:'#b9a77f',wall:'#1c1810'},
  pergamino:{name:'Pergamino',bg:'#efe5cf',surface:'#faf4e6',surface2:'#ece1c7',primary:'#6b3e1f',accent:'#a8741a',text:'#2b1d10',muted:'#7a6650',wall:'#3a2a1c'},
  medianoche:{name:'Medianoche',bg:'#0f1115',surface:'#181b21',surface2:'#22262e',primary:'#5865f2',accent:'#f5b971',text:'#eceef2',muted:'#8d93a1',wall:'#13161b'},
  sakura:{name:'Sakura',bg:'#fbf1f3',surface:'#ffffff',surface2:'#f6e3e8',primary:'#b84a6a',accent:'#c98a2b',text:'#3a2229',muted:'#94707b',wall:'#4a2f37'},
  bosque:{name:'Bosque élfico',bg:'#0e1a14',surface:'#16261d',surface2:'#203629',primary:'#3f7a52',accent:'#d9c27a',text:'#eef0e2',muted:'#9fb3a3',wall:'#0f1e16'},
};
const COLOR_KEYS=[['bg','Fondo'],['surface','Paneles'],['surface2','Campos'],['primary','Principal'],['accent','Detalles (dorado)'],['text','Texto'],['muted','Texto suave'],['wall','Fondo del mueble']];
const WOODS={nogal:{l:'Nogal',c:['#5b3a22','#3a2414']},roble:{l:'Roble claro',c:['#a9784a','#7a5232']},cerezo:{l:'Cerezo',c:['#7b3b28','#4f2216']},ebano:{l:'Ébano',c:['#2b2a30','#141317']},blanco:{l:'Lacado blanco',c:['#ebe6dc','#c8c1b2']},tema:{l:'Color de la paleta',c:null}};

/* ================= Almacenamiento ================= */
const DB={db:null,ls:false,
  open(){return new Promise((res,rej)=>{try{const r=indexedDB.open('mi-biblioteca',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>{this.db=r.result;res()};r.onerror=()=>rej(r.error)}catch(e){rej(e)}})},
  get(k){if(this.ls){try{return Promise.resolve(JSON.parse(localStorage.getItem('mb-'+k)||'null'))}catch(e){return Promise.resolve(null)}}return new Promise((res,rej)=>{const t=this.db.transaction('kv').objectStore('kv').get(k);t.onsuccess=()=>res(t.result);t.onerror=()=>rej(t.error)})},
  set(k,v){if(this.ls){try{localStorage.setItem('mb-'+k,JSON.stringify(v));return Promise.resolve()}catch(e){return Promise.reject(new Error('este navegador no permite guardar aquí'))}}return new Promise((res,rej)=>{const tx=this.db.transaction('kv','readwrite');tx.objectStore('kv').put(v,k);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)})}
};
let state=null, saveT=null;
function save(){state.updatedAt=Date.now();clearTimeout(saveT);saveT=setTimeout(()=>DB.set('state',state).catch(e=>toast('No se pudo guardar: '+e.message)),250);Cloud.schedulePush()}
function defaultState(){
  const s=[{id:uid(),name:'Mis favoritos'},{id:uid(),name:'Fantasía y aventura'},{id:uid(),name:'Por leer'}];
  return {version:1,books:[],shelves:s,settings:{title:'Mi Biblioteca',theme:'ravenclaw',custom:null,wood:'nogal',defaultDisplay:'spine'}};
}
const ui={view:'shelf',status:'all',fmt:'all',genre:'',q:'',sort:'title',results:[]};
const byId=id=>state.books.find(b=>b.id===id);
const booksOn=sid=>state.books.filter(b=>b.shelfId===sid).sort((a,b)=>(a.pos??0)-(b.pos??0));

/* ================= Tema ================= */
const currentColors=()=>state.settings.theme==='custom'&&state.settings.custom?state.settings.custom:(THEMES[state.settings.theme]||THEMES.ravenclaw);
function applyTheme(){
  const t=currentColors(),r=document.documentElement.style;
  r.setProperty('--bg',t.bg);r.setProperty('--surface',t.surface);r.setProperty('--surface-2',t.surface2);
  r.setProperty('--primary',t.primary);r.setProperty('--accent',t.accent);r.setProperty('--text',t.text);
  r.setProperty('--muted',t.muted);r.setProperty('--wall',t.wall);
  r.setProperty('--on-accent',textOn(t.accent));r.setProperty('--on-primary',textOn(t.primary));
  const w=WOODS[state.settings.wood]||WOODS.nogal;const wc=w.c||[t.primary,t.bg];
  r.setProperty('--shelf-1',wc[0]);r.setProperty('--shelf-2',wc[1]);
  $('meta[name=theme-color]').content=t.bg;
  document.title=state.settings.title||'Mi Biblioteca';
  $('#libTitle').textContent=state.settings.title||'Mi Biblioteca';
}

/* ================= Piezas visuales ================= */
const colorOf=b=>b.spineColor||hashColor((b.title||'')+(b.author||''));
const bookH=b=>165+hash(b.title||'x')%45;
const bookW=b=>{const p=num(b.pages);return p?Math.max(20,Math.min(58,Math.round(p/15))):24+hash((b.author||'')+b.title)%14};

function genCover(title,author,color,cls=''){
  return `<div class="gen-cover ${cls}" style="--c:${color};--tc:${textOn(color)}"><div class="gc-frame"><div class="gc-t">${esc(title||'Sin título')}</div><div class="gc-a">${esc(author||'')}</div></div></div>`;
}
function coverEl(b,cls=''){
  if(b.cover)return `<img src="${esc(b.cover)}" alt="" draggable="false" loading="lazy" data-t="${esc(b.title)}" data-a="${esc(b.author)}" data-c="${colorOf(b)}" data-cls="${cls}" onerror="coverFail(this)">`;
  return genCover(b.title,b.author,colorOf(b),cls);
}
window.coverFail=img=>{const d=img.dataset;img.outerHTML=genCover(d.t,d.a,d.c,d.cls)};
function spineInner(b){
  const c=colorOf(b);
  const img=b.spineImg?`background-image:url(&quot;${esc(b.spineImg)}&quot;)`:'';
  const au=(b.author||'').split(',')[0];
  return `<div class="spine ${b.spineImg?'has-img':''}" style="--c:${c};--tc:${textOn(c)};${img}"><span class="sp-t">${esc(b.title)}</span><span class="sp-a">${esc(au)}</span></div>`;
}
function fmtBadge(b){
  if(isPhysical(b))return '';
  const f=FORMAT[b.format]||FORMAT.ebook;
  return `<span class="fmt" title="${f.l} — no está en físico">${ic(f.i)}</span>`;
}
function matches(b){
  if(ui.status!=='all'){if(ui.status==='deseado'){if(b.format!=='deseado')return false}else if(b.status!==ui.status)return false}
  if(ui.fmt==='fisico'&&!isPhysical(b))return false;
  if(ui.fmt==='digital'&&!['ebook','audio','ambos'].includes(b.format))return false;
  if(ui.fmt==='nofisico'&&isPhysical(b))return false;
  if(ui.genre&&!genresOf(b.genre).some(g=>norm(g)===norm(ui.genre)))return false;
  if(ui.q){const q=norm(ui.q);if(!norm([b.title,b.author,b.isbn,b.genre,b.publisher].join(' ')).includes(q))return false}
  return true;
}
function bookHTML(b){
  const cls=`st-${b.status}${matches(b)?'':' dim'}`;
  const h=bookH(b),w=bookW(b);
  const ribbon=b.status==='leyendo'?'<i class="ribbon"></i>':'';
  const attrs=`draggable="true" data-id="${b.id}" data-open="${b.id}" title="${esc(b.title)}${b.author?' — '+esc(b.author):''}"`;
  if(b.display==='cover')return `<div class="book cover-mode ${cls}" ${attrs} style="--h:${Math.round(h*.95)}px;--w:${Math.round(h*.95*.66)}px">${coverEl(b)}${fmtBadge(b)}${ribbon}</div>`;
  if(b.display==='flat'){const off=(hash(b.id)%13)-6;return `<div class="book flat ${cls}" ${attrs} style="--h:${Math.round(h*.88)}px;--w:${w}px;margin-left:${off}px">${spineInner(b)}${fmtBadge(b)}</div>`}
  return `<div class="book spine-mode ${cls}" ${attrs} style="--h:${h}px;--w:${w}px">${spineInner(b)}${fmtBadge(b)}${ribbon}</div>`;
}
function rowHTML(books){
  if(!books.length)return '<div class="empty-shelf">Estante vacío · arrastra libros aquí</div>';
  let html='',stack=[];
  const flush=()=>{if(stack.length){html+=`<div class="stack">${stack.map(bookHTML).join('')}</div>`;stack=[]}};
  for(const b of books){if(b.display==='flat'){stack.push(b);if(stack.length>=6)flush()}else{flush();html+=bookHTML(b)}}
  flush();return html;
}
function starsHTML(r,interactive=false,target='',cls=''){
  r=r||0;let s='';
  for(let i=1;i<=5;i++){const f=r>=i?100:r>=i-.5?50:0;s+=`<span class="star" data-i="${i}" style="--f:${f}%">★</span>`}
  return `<span class="stars ${interactive?'interactive':''} ${cls}" data-r="${r}" data-target="${target}" ${interactive?'title="Pulsa en la mitad izquierda de una estrella para media estrella"':''}>${s}</span>`;
}
function paintStars(wrap,v){[...wrap.children].forEach((s,k)=>{const i=k+1;s.style.setProperty('--f',(v>=i?100:v>=i-.5?50:0)+'%')})}
const statusPill=b=>{const s=STATUS[b.status];return `<span class="pill" style="--pc:${s.c}">${ic(s.i)}${s.l}</span>`};
const formatPill=b=>{const f=FORMAT[b.format]||FORMAT.fisico;return `<span class="pill" style="--pc:${isPhysical(b)?'#8a7f6a':'var(--accent)'}">${ic(f.i)}${f.l}</span>`};
const progressOf=b=>{const p=num(b.pages),c=num(b.currentPage);return p&&c?Math.max(0,Math.min(100,Math.round(c/p*100))):0};

function statsView(){
  const B=state.books,owned=B.filter(b=>b.format!=='deseado');

  const pvp=sum(owned,'price'),paid=sum(owned,'paid');

  const rated=B.filter(b=>b.rating>0),avg=rated.length?rated.reduce((s,b)=>s+b.rating,0)/rated.length:0;
  const pagesRead=B.filter(b=>b.status==='leido').reduce((s,b)=>s+(num(b.pages)||0),0);
  const y=String(new Date().getFullYear());
  const readYear=B.filter(b=>b.status==='leido'&&(b.endDate||'').startsWith(y)).length;
  const wish=B.filter(b=>b.format==='deseado');
  const maxS=Math.max(1,...Object.keys(STATUS).map(k=>B.filter(b=>b.status===k).length));
  const fmts=Object.entries(FORMAT).map(([k,f])=>[f.l,B.filter(b=>b.format===k).length]);const maxF=Math.max(1,...fmts.map(f=>f[1]));
  const au={};B.forEach(b=>(b.author||'').split(',').map(s=>s.trim()).filter(Boolean).forEach(a=>au[a]=(au[a]||0)+1));
  const topA=Object.entries(au).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const best=[...rated].sort((a,b)=>b.rating-a.rating).slice(0,6);
  return `<div class="stats">
    <div class="stat"><small>Libros</small><b>${B.length}</b><span>${B.filter(isPhysical).length} en físico · ${B.filter(b=>!isPhysical(b)&&b.format!=='deseado').length} solo digital</span></div>
    <div class="stat"><small>Leídos en ${y}</small><b>${readYear}</b><span>${B.filter(b=>b.status==='leido').length} leídos en total</span></div>
    <div class="stat"><small>Páginas leídas</small><b>${pagesRead.toLocaleString('es-ES')}</b><span>de libros terminados</span></div>
    <div class="stat"><small>Valoración media</small><b>${avg?avg.toFixed(1).replace('.',','):'—'}</b>${starsHTML(Math.round(avg*2)/2,false,'','sm')}</div>
    <div class="stat"><small>Valor (PVP)</small><b>${eur(pvp)}</b><span>de lo que tienes</span></div>
    <div class="stat"><small>Lo que he pagado</small><b>${eur(paid)}</b><span>${saved>0?'Has ahorrado '+eur(saved):saved<0?'Pagado de más '+eur(-saved):'—'}</span></div>
    <div class="stat"><small>Lista de deseos</small><b>${wish.length}</b><span>${sum(wish,'price')?'Costaría '+eur(sum(wish,'price')):'libros que quieres'}</span></div>
  </div>
  <div class="panels">
    <div class="panel"><h2 class="section-t">Por estado</h2>${Object.entries(STATUS).map(([k,s])=>{const n=B.filter(b=>b.status===k).length;return `<div class="bar"><span>${s.l}</span><span class="track"><i style="width:${n/maxS*100}%;background:${s.c}"></i></span><b>${n}</b></div>`}).join('')}</div>
    <div class="panel"><h2 class="section-t">Por formato</h2>${fmts.map(([l,n])=>`<div class="bar"><span>${l.replace(/ \(.*\)/,'')}</span><span class="track"><i style="width:${n/maxF*100}%;background:var(--accent)"></i></span><b>${n}</b></div>`).join('')}</div>
    <div class="panel"><h2 class="section-t">Mejor valorados</h2>${best.length?`<ul class="toplist">${best.map(b=>`<li data-open="${b.id}"><span>${esc(b.title)}</span>${starsHTML(b.rating,false,'','sm')}</li>`).join('')}</ul>`:'<p class="muted">Aún no has valorado ningún libro.</p>'}</div>
    <div class="panel"><h2 class="section-t">Autores más presentes</h2>${topA.length?`<ul class="toplist">${topA.map(([a,n])=>`<li><span>${esc(a)}</span><span class="muted">${n}</span></li>`).join('')}</ul>`:'<p class="muted">—</p>'}</div>
  </div>`;
}

const stripHtml=s=>{const d=document.createElement('div');d.innerHTML=String(s).replace(/<br\s*\/?>/gi,'\n').replace(/<\/p>/gi,'\n\n');return (d.textContent||'').trim()};
async function searchOnline(q){

  const key=(state.settings.gkey||'').trim();

  const getJ=u=>fetch(u).then(r=>{if(!r.ok)throw new Error(r.status);return r.json()});
  const [g,o,ed]=await Promise.allSettled([getJ(gUrl),getJ(oUrl),isIsbn?olEdition(clean):Promise.resolve(null)]);
  const out=[];
  if(ed.status==='fulfilled'&&ed.value)out.push(ed.value);
  if(g.status==='rejected')ui.gFail=true;
  if(g.status==='fulfilled')for(const it of g.value.items||[]){
    const v=it.volumeInfo||{},ids=v.industryIdentifiers||[];
    const i13=ids.find(x=>x.type==='ISBN_13')?.identifier,i10=ids.find(x=>x.type==='ISBN_10')?.identifier;
    let cover=(v.imageLinks?.thumbnail||v.imageLinks?.smallThumbnail||'').replace('http://','https://').replace('&edge=curl','');
    const lp=it.saleInfo?.listPrice||it.saleInfo?.retailPrice;
    out.push({src:'Google',title:v.title||'',author:(v.authors||[]).join(', '),publisher:v.publisher||'',year:(v.publishedDate||'').slice(0,4),pages:v.pageCount||'',
      isbn:isIsbn?clean:(i13||i10||''),isbns:[i13,i10].filter(Boolean),synopsis:stripHtml(v.description||''),cover,
      covers:cover?[cover.replace(/zoom=\d/,'zoom=1')+'&fife=w600',cover]:[],price:lp&&lp.currencyCode==='EUR'?lp.amount:'',genre:mapCats(v.categories)});
  }
  if(o.status==='fulfilled')for(const d of o.value.docs||[]){
    // con lang=es, Open Library trae primero la edición en español (título, portada y editorial de esa edición)
    const e=d.editions?.docs?.[0],es=e&&(e.language||[]).includes('spa');
    const isbns=es?(e.isbn||[]):(d.isbn||[]);const i13=isIsbn?clean:(isbns.find(x=>x.length===13)||isbns[0]||'');
    const cv=[es&&e.cover_i,d.cover_i].filter(Boolean);
    out.push({src:es?'Open Library · en español':'Open Library',title:(es&&e.title)||d.title||'',author:(d.author_name||[]).join(', '),publisher:(es&&e.publisher?.[0])||(d.publisher||[])[0]||'',
      year:(es&&(String(e.publish_date||'').match(/\d{4}/)||[])[0])||d.first_publish_year||'',pages:d.number_of_pages_median||'',
      isbn:i13,isbns:i13?[i13]:[],synopsis:'',cover:cv[0]?`https://covers.openlibrary.org/b/id/${cv[0]}-M.jpg`:'',
      covers:[...new Set(cv)].map(c=>`https://covers.openlibrary.org/b/id/${c}-L.jpg`),olKey:d.key});
  }
  if(g.status==='rejected'&&o.status==='rejected'&&!out.length)throw new Error('sin conexión');
  if(isIsbn&&out[0]&&!out[0].author)out[0].author=out.find(r=>r.author)?.author||'';
  return out;
}
// Edición exacta por ISBN (título y editorial en el idioma de tu ejemplar)
async function olEdition(isbn){
  const r=await fetch(`https://openlibrary.org/isbn/${isbn}.json`);if(!r.ok)return null;const e=await r.json();
  const names=await Promise.all((e.authors||[]).slice(0,3).map(a=>fetch(`https://openlibrary.org${a.key}.json`).then(x=>x.json()).then(x=>x.name).catch(()=>'')));
  let synopsis=typeof e.description==='string'?e.description:e.description?.value||'';
  const cov=(e.covers||[]).filter(c=>c>0);
  return {src:'Open Library · tu edición',title:[e.title,e.subtitle].filter(Boolean).join(': '),author:names.filter(Boolean).join(', '),publisher:(e.publishers||[])[0]||'',
    year:(String(e.publish_date||'').match(/\d{4}/)||[''])[0],pages:e.number_of_pages||'',isbn,isbns:[isbn],synopsis,
    cover:cov[0]?`https://covers.openlibrary.org/b/id/${cov[0]}-M.jpg`:'',covers:cov.slice(0,4).map(c=>`https://covers.openlibrary.org/b/id/${c}-L.jpg`),
    olKey:(e.works||[])[0]?.key};
}

const testImg=u=>new Promise(r=>{const i=new Image();const t=setTimeout(()=>r(false),12000);i.onload=()=>{clearTimeout(t);r(i.naturalWidth>20&&i.naturalHeight>20)};i.onerror=()=>{clearTimeout(t);r(false)};i.src=u});
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const cleanIsbn=s=>String(s||'').replace(/[^\dXx]/g,'').toUpperCase();
// ISBN-13 (978…) → ISBN-10, que es como Amazon guarda las portadas
function isbn10(i){if(/^\d{9}[\dX]$/.test(i))return i;if(!/^978\d{10}$/.test(i))return null;const c=i.slice(3,12);let s=0;for(let k=0;k<9;k++)s+=(10-k)*+c[k];const d=(11-s%11)%11;return c+(d===10?'X':d)}
const tclean=s=>norm(s).replace(/\(.*?\)|\[.*?\]/g,'').replace(/[^a-z0-9 ]/g,'').replace(/\s+/g,' ').trim();
// ¿el título encontrado es el mismo libro? (no un pack, ni otro de la saga)
function sameTitle(found,wanted){
  const f=tclean(found),w=tclean(wanted);if(!f||!w)return false;
  if(/\b(pack|estuche|trilogia|box set)\b/.test(f)&&!/\b(pack|estuche|trilogia)\b/.test(w))return false;
  return f===w||((f.startsWith(w)||w.startsWith(f))&&Math.max(f.length,w.length)/Math.min(f.length,w.length)<=2);
}
// Portadas para un libro (por ISBN y por título + autor), de varias fuentes, solo las que existen de verdad
async function findCovers(b,max=4){
  const isbn=cleanIsbn(b.isbn),title=(b.title||'').trim(),author=(b.author||'').split(',')[0].trim();
  const key=(state.settings.gkey||'').trim(),getJ=u=>fetch(u).then(r=>r.ok?r.json():null).catch(()=>null);
  const gUrl=q=>'https://www.googleapis.com/books/v1/volumes?maxResults=6&printType=books&q='+encodeURIComponent(q)+(key?'&key='+encodeURIComponent(key):'');
  const gCov=(j,chk)=>(j?.items||[]).filter(it=>!chk||sameTitle(it.volumeInfo?.title,title)).map(it=>(it.volumeInfo?.imageLinks?.thumbnail||'').replace('http://','https://').replace('&edge=curl','')).filter(Boolean).map(c=>c.replace(/zoom=\d/,'zoom=1')+'&fife=w600');
  const oCov=j=>(j?.docs||[]).flatMap(d=>{const e=d.editions?.docs?.[0];return [e&&sameTitle(e.title,title)&&e.cover_i,sameTitle(d.title,title)&&d.cover_i]}).filter(Boolean).map(c=>`https://covers.openlibrary.org/b/id/${c}-L.jpg`);
  const jobs=[];
  const i10=isbn10(isbn);
  if(isbn){jobs.push(Promise.resolve([`https://covers.openlibrary.org/b/isbn/${isbn}-L.jpg?default=false`,...(i10?[`https://images-na.ssl-images-amazon.com/images/P/${i10}.01.LZZZZZZZ.jpg`]:[])]));jobs.push(getJ(gUrl('isbn:'+isbn)).then(gCov))}
  if(title){
    jobs.push(getJ(gUrl('intitle:'+title+(author?' inauthor:'+author:''))).then(j=>gCov(j,true)));
    jobs.push(getJ('https://openlibrary.org/search.json?limit=6&lang=es&fields=title,cover_i,editions,editions.title,editions.cover_i&title='+encodeURIComponent(title)+(author?'&author='+encodeURIComponent(author):'')).then(oCov));
  }
  const list=[...new Set((await Promise.all(jobs)).flat())].slice(0,14);
  const ok=await Promise.all(list.map(testImg));
  return list.filter((u,i)=>ok[i]).slice(0,max);
}
// Elige, entre los resultados de búsqueda, el que de verdad es ese libro
function pickBest(res,b){
  if(!res.length)return null;
  const isbn=cleanIsbn(b.isbn);
  const t=tclean(b.title),a=norm((b.author||'').split(',')[0]).split(/\s+/).filter(w=>w.length>2);
  // por ISBN, pero comprobando que se parece (a veces el ISBN apuntado es el de otro libro)
  if(isbn){const m=res.find(r=>(r.isbns||[]).some(i=>cleanIsbn(i)===isbn)||cleanIsbn(r.isbn)===isbn);
    if(m){const rt=norm(m.title).replace(/[^a-z0-9 ]/g,''),ra=norm(m.author);
      const tw=t.split(' ').filter(w=>w.length>3);
      if(!t||!tw.length||tw.some(w=>rt.includes(w))||a.some(w=>ra.includes(w)))return m}}
  if(!t)return isbn?res[0]:null;
  let best=null,bs=0;
  for(const r of res){
    const rt=tclean(r.title);if(!rt)continue;
    // «Pack X / Y», «Trilogía…»: si el título encontrado es mucho más largo, es otro libro
    if(/\b(pack|estuche|trilogia|saga completa|box set|coleccion)\b/.test(rt)&&!/\b(pack|estuche|trilogia|coleccion)\b/.test(t))continue;
    const ratio=Math.max(rt.length,t.length)/Math.max(1,Math.min(rt.length,t.length));
    let s=rt===t?3:((rt.startsWith(t)||t.startsWith(rt))&&ratio<=2)?2:((rt.includes(t)||t.includes(rt))&&ratio<=1.5)?1:0;
    if(!s)continue;
    if(a.length){const ra=norm(r.author);if(a.some(w=>ra.includes(w)))s+=2;else if(r.author)s-=1}
    if(r.cover)s+=.5;if(r.synopsis)s+=.3;
    if(s>bs){bs=s;best=r}
  }
  return bs>=1.5?best:null;
}
// Completa un libro guardado con lo que falte: portada, color del lomo, sinopsis, páginas…
async function enrichBook(id){
  let b=byId(id);if(!b)return;
  const isbn=cleanIsbn(b.isbn),q1=isbn||`${b.title} ${(b.author||'').split(',')[0]}`.trim();
  let res=[];try{res=await searchOnline(q1)}catch(e){}
  let r=pickBest(res,b);
  const isbnBad=isbn&&res.length&&!r; // ese ISBN es de otro libro: no lo uso para la portada
  if(!r&&isbn&&b.title){try{res=await searchOnline(`${b.title} ${(b.author||'').split(',')[0]}`.trim());r=pickBest(res,{...b,isbn:''})}catch(e){}}
  // a veces el autor está apuntado distinto («Sherry» por «Sherrilyn»): pruebo solo con el título
  if(!r&&b.title&&b.author){try{res=await searchOnline(b.title.replace(/\(.*?\)/g,'').trim());r=pickBest(res,{...b,isbn:''})}catch(e){}}
  b=byId(id);if(!b)return;
  if(r){
    // el ISBN solo si el resultado es de verdad su edición (buscada por ISBN); si no, podría ser el de otra edición
    for(const k of ['author','publisher','year','pages','genre','synopsis'])if(!String(b[k]??'').trim()&&r[k])b[k]=String(r[k]);
    if(num(b.price)==null&&num(r.price)!=null)b.price=num(r.price);
  }
  if(!b.cover){
    const list=[...new Set([...(r?.covers||[]),...(r?.isbns||[]).map(i=>`https://covers.openlibrary.org/b/isbn/${i}-L.jpg?default=false`)])].slice(0,6);
    const ok=await Promise.all(list.map(testImg));
    let c=list.find((u,i)=>ok[i]);
    if(!c)c=(await findCovers(isbnBad?{...b,isbn:''}:b,1))[0];
    b=byId(id);if(b&&c&&!b.cover)b.cover=c;
  }
  if(b&&!b.synopsis&&r?.olKey){try{const w=await fetch(`https://openlibrary.org${r.olKey}.json`).then(x=>x.json());const desc=typeof w.description==='string'?w.description:w.description?.value;b=byId(id);if(b&&desc&&!b.synopsis)b.synopsis=desc}catch(e){}}
  b=byId(id);
  if(b&&b.cover&&!b.spineColor){const c=await dominantColor(b.cover);b=byId(id);if(b&&c&&!b.spineColor)b.spineColor=c}
  if(b){save();if(!draft)render()}
}

const Enrich={q:[],running:false,done:0,
  add(ids){for(const id of ids)if(!this.q.includes(id))this.q.push(id);this.run()},

function dominantColor(url){
  return new Promise(res=>{
    const img=new Image();img.crossOrigin='anonymous';
    img.onload=()=>{try{
      const c=document.createElement('canvas');c.width=24;c.height=36;const x=c.getContext('2d');x.drawImage(img,0,0,24,36);
      const d=x.getImageData(0,0,24,36).data,bk={};
      for(let i=0;i<d.length;i+=4){const r=d[i],g=d[i+1],b=d[i+2];const mx=Math.max(r,g,b),mn=Math.min(r,g,b);const sat=mx?(mx-mn)/mx:0;
        const k=(r>>5)+','+(g>>5)+','+(b>>5);const o=bk[k]||(bk[k]={n:0,w:0,r:0,g:0,b:0});o.n++;o.w+=.35+sat;o.r+=r;o.g+=g;o.b+=b}
      const best=Object.values(bk).sort((a,b)=>b.w-a.w)[0];
      res(best?rgbHex(best.r/best.n,best.g/best.n,best.b/best.n):null);
    }catch(e){res(null)}};
    img.onerror=()=>res(null);
    img.src=url+(url.startsWith('data:')?'':(url.includes('?')?'&':'?')+'cors=1');
  });
}
function autoSpineColor(force){

  });
}
function fileToDataURL(file,max=800){

    const sc=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');
    c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    res(c.toDataURL('image/jpeg',.86))};img.onerror=rej;img.src=fr.result};fr.onerror=rej;fr.readAsDataURL(file)});

const IMP_GUESS=[['currentPage',/pagina actual|voy por/],['paid',/pagad|pague|me costo|coste|costo|precio de compra|precio pagado/],['startDate',/empez|inicio|comienzo|empece/],['endDate',/terminad|fin de lectura|acabad|termine|fecha de lectura|leido el/],
  ['author',/autor|author|escritor/],['title',/^(titulo|title|libro|nombre)|titulo/],['isbn',/isbn|ean/],['publisher',/editorial|publisher|sello/],['edition',/edicion|encuadernacion|tapa/],['genre',/genero|genre|categoria|tematica/],
  ['synopsis',/sinopsis|resumen|argumento/],['review',/opinion|comentario|resena|review|notas personales/],['rating',/valoracion|puntuacion|estrellas|rating|^nota$|calificacion/],['price',/precio|pvp|price/],
  ['status',/estado|leido|status|^leer/],['format',/formato|format|soporte|tipo|fisico|digital/],['shelf',/estante|estanteria|balda|ubicacion|coleccion/],['year',/^ano|year|ano de publicacion|publicacion/],['pages',/pagina|pags|pages/]];
async function readSpreadsheet(file){
  toast('Leyendo el archivo…');
  try{await loadScript('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js')}catch(e){toast('Necesito internet para leer el Excel');return}
  let wb;try{wb=/\.(csv|txt|tsv)$/i.test(file.name)?XLSX.read(await file.text(),{type:'string',cellDates:true}):XLSX.read(await file.arrayBuffer(),{cellDates:true})}catch(e){toast('No he podido abrir ese archivo');return}
  // la primera hoja que tenga datos
  let rows=[],sheet='';
  for(const n of wb.SheetNames){const r=XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true,defval:''}).filter(x=>x.some(c=>String(c).trim()!==''));if(r.length>1){rows=r;sheet=n;break}}
  if(!rows.length){toast('El archivo está vacío');return}
  // fila de cabecera: la primera (de las 10 primeras) donde reconozco algún nombre de columna
  let hi=rows.slice(0,10).findIndex(r=>r.some(c=>typeof c==='string'&&IMP_GUESS.some(([,re])=>re.test(norm(c).trim()))));if(hi<0)hi=0;
  const width=Math.max(...rows.map(r=>r.length));
  const header=Array.from({length:width},(_,i)=>String(rows[hi][i]??'').trim());
  const data=rows.slice(hi+1);
  const map={};
  header.forEach((h,i)=>{const n=norm(h).trim();if(!n)return;for(const [k,re] of IMP_GUESS)if(map[k]==null&&re.test(n)){map[k]=i;break}});
  if(map.title==null)map.title=header.findIndex((h,i)=>!Object.values(map).includes(i));
  imp={file:file.name,sheet,header,data,map};
  openImport();
}

const cellStr=v=>v==null?'':v instanceof Date?v.toISOString().slice(0,10):String(v).trim();
function impMoney(v){if(typeof v==='number')return Math.round(v*100)/100;let s=cellStr(v).replace(/[€\s]|eur/gi,'');if(!s)return null;if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');const x=parseFloat(s);return isNaN(x)?null:x}
function impDate(v){
  if(v instanceof Date)return new Date(v.getTime()+12*36e5).toISOString().slice(0,10);
  if(typeof v==='number'&&v>20000&&v<80000)return new Date(Math.round((v-25569)*864e5)).toISOString().slice(0,10);
  const s=cellStr(v);let m=s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})$/);
  if(m){const y=m[3].length===2?'20'+m[3]:m[3];return `${y}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`}
  m=s.match(/^\d{4}-\d{2}-\d{2}/);return m?m[0]:'';
}
function impStatus(v){
  if(v===true)return 'leido';if(v===false)return 'pendiente';
  const n=norm(cellStr(v)).trim();if(!n)return null;
  if(/desterr|abandon|dejad|no me gust|dnf/.test(n))return 'desterrado';
  if(/leyendo|empezad|en curso|actual|a medias/.test(n))return 'leyendo';
  if(/pendiente|por leer|no leido|sin leer|^no$|tbr|quiero leer/.test(n))return 'pendiente';
  if(/^(si|x|✓|✔|ok|yes|true|1)$|leido|terminad|acabad/.test(n))return 'leido';
  return null;
}
function impFormat(v){
  const n=norm(cellStr(v)).trim();if(!n)return null;
  if(/ambos|los dos|fisico y|y digital|\+/.test(n))return 'ambos';
  if(/audio/.test(n))return 'audio';
  if(/desead|wish|no lo tengo|quiero|comprar/.test(n))return 'deseado';
  if(/ebook|e-book|digital|kindle|epub|pdf|electron|kobo/.test(n))return 'ebook';
  if(/fisico|papel|tapa|bolsillo|^si$|^x$/.test(n))return 'fisico';
  return null;
}
function impRating(v){
  let x=typeof v==='number'?v:null;const s=cellStr(v);
  if(x==null){const st=(s.match(/★/g)||[]).length;if(st)x=st+(/½/.test(s)?.5:0);else{const m=s.replace(',','.').match(/(\d+(?:\.\d+)?)(?:\s*\/\s*(\d+))?/);if(m)x=m[2]?parseFloat(m[1])/parseFloat(m[2])*5:parseFloat(m[1])}}
  if(x==null||isNaN(x)||x<=0)return 0;if(x>5&&x<=10)x=x/2;return Math.max(0,Math.min(5,Math.round(x*2)/2));
}
function impBooks(){
  const M=imp.map,get=(r,k)=>M[k]==null?'':r[M[k]];
  const defFmt=$('#impFmt')?.value||'fisico',defSt=$('#impSt')?.value||'pendiente';
  // repetido = mismo título y autor (no me fío solo del ISBN: en las hojas a veces se copia el de otro libro)
  const key=(t,a)=>norm(t).replace(/[^a-z0-9]/g,'')+'|'+norm(String(a||'').split(',')[0]).replace(/[^a-z0-9]/g,'');
  const seen=new Set(state.books.map(b=>key(b.title,b.author)));
  const out=[];let dup=0,empty=0;
  for(const r of imp.data){
    const title=cellStr(get(r,'title'));if(!title){empty++;continue}
    const iv=get(r,'isbn');let isbn=typeof iv==='number'?String(Math.round(iv)):cleanIsbn(iv);
    if(typeof iv==='number'&&isbn.length===9)isbn='0'+isbn; // Excel se come el 0 inicial de algunos ISBN-10
    if(isbn.length!==10&&isbn.length!==13)isbn=''; // «[No encontrado]», «Ver nota», números de más…
    const author=cellStr(get(r,'author'));
    const k=key(title,author);
    if(seen.has(k)){dup++;continue}
    seen.add(k);
    const yv=get(r,'year'),pv=get(r,'pages');
    const b={title,author,isbn,
      publisher:cellStr(get(r,'publisher')),
      year:yv instanceof Date?String(yv.getFullYear()):(cellStr(yv).match(/\d{4}/)||[''])[0],
      pages:typeof pv==='number'?String(Math.round(pv)):(cellStr(pv).match(/\d+/)||[''])[0],
      genre:[...new Map(genresOf(cellStr(get(r,'genre')).replace(/\s*[\/:]\s*/g,', ')).map(g=>g.replace(/\s*\(.*?\)\s*/g,'').trim()).filter(Boolean).map(g=>[norm(g),g.charAt(0).toUpperCase()+g.slice(1)])).values()].join(', '),
      edition:cellStr(get(r,'edition')),
      price:impMoney(get(r,'price')),paid:impMoney(get(r,'paid')),
      status:impStatus(get(r,'status'))||defSt,format:impFormat(get(r,'format'))||defFmt,
      rating:impRating(get(r,'rating')),review:cellStr(get(r,'review')),synopsis:cellStr(get(r,'synopsis')),
      startDate:impDate(get(r,'startDate')),endDate:impDate(get(r,'endDate')),
      currentPage:(cellStr(get(r,'currentPage')).match(/\d+/)||[''])[0],
      _shelf:cellStr(get(r,'shelf'))};
    out.push(b);
  }
  return {books:out,dup,empty};
}
function renderImpPreview(){
  const el=$('#impPrev');if(!el||!imp)return;
  if(imp.map.title==null||imp.map.title<0){el.innerHTML='<p class="hint" style="color:#ff9a9a">Elige qué columna tiene el título.</p>';$('#impGo').disabled=true;return}
  const {books,dup,empty}=impBooks();$('#impGo').disabled=!books.length;
  $('#impGo').innerHTML=`${ic('check')} Importar ${books.length} ${books.length===1?'libro':'libros'}`;
  el.innerHTML=`<div class="d-label">Vista previa</div>
   <p class="hint">${books.length} libros nuevos${dup?` · ${dup} ya estaban en tu biblioteca (no los repito)`:''}${empty?` · ${empty} filas sin título (las salto)`:''}</p>
   <div class="imp-wrap"><table class="imp-table"><tr><th>Título</th><th>Autor/a</th><th>ISBN</th><th>Estado</th><th>Tengo</th><th>PVP</th><th>Pagué</th></tr>
   ${books.slice(0,6).map(b=>`<tr><td>${esc(b.title)}</td><td>${esc(b.author)}</td><td>${esc(b.isbn)}</td><td>${STATUS[b.status].l}</td><td>${FORMAT[b.format].l.replace(/ \(.*\)/,'')}</td><td>${b.price!=null?eur(b.price):''}</td><td>${b.paid!=null?eur(b.paid):''}</td></tr>`).join('')}</table></div>
   ${books.length>6?`<p class="hint">…y ${books.length-6} más</p>`:''}`;
}
function doImport(){
  const {books}=impBooks();if(!books.length)return;
  let defShelf=$('#impShelf').value;
  if(defShelf==='__new'){const s={id:uid(),name:'Del Excel'};state.shelves.push(s);defShelf=s.id}
  const enrich=$('#impEnrich').checked,ids=[],now=Date.now();
  books.forEach((x,i)=>{
    const {_shelf,...data}=x;let sid=defShelf;
    if(_shelf){let sh=state.shelves.find(s=>norm(s.name)===norm(_shelf));if(!sh){sh={id:uid(),name:_shelf};state.shelves.push(sh)}sid=sh.id}
    const b={...blankBook(sid),...data,id:uid(),shelfId:sid,added:new Date(now-i).toISOString(),pos:booksOn(sid).length};
    state.books.push(b);ids.push(b.id);
  });
  imp=null;save();closeModal();render();
  toast(`${ids.length} libros añadidos${enrich?' · ahora busco sus portadas':''}`);
  if(enrich)Enrich.add(ids);
}

function setShelfOrder(sid,list){list.forEach((x,k)=>{x.shelfId=sid;x.pos=k})}
function moveBook(id,sid,beforeId){
  const b=byId(id);if(!b)return;
  const list=booksOn(sid).filter(x=>x.id!==id);
  let i=beforeId?list.findIndex(x=>x.id===beforeId):list.length;if(i<0)i=list.length;
  list.splice(i,0,b);setShelfOrder(sid,list);save();render();
}
function addShelf(){
  const name=prompt('Nombre del nuevo estante:','Estante '+(state.shelves.length+1));if(name===null)return;
  state.shelves.push({id:uid(),name:name.trim()||'Estante'});save();render();

}
function delShelf(sid){
  if(state.shelves.length<=1){toast('Necesitas al menos un estante');return}
  const sh=state.shelves.find(s=>s.id===sid);const books=booksOn(sid);
  if(!confirm(`¿Eliminar el estante «${sh.name}»?${books.length?`\nSus ${books.length} libros pasarán a otro estante.`:''}`))return;
  state.shelves=state.shelves.filter(s=>s.id!==sid);

}

  const a=e.target.closest('[data-act]');

  switch(act){
    case 'view':ui.view=a.dataset.v;render();window.scrollTo({top:0});break;
    case 'filter':ui.status=a.dataset.s;render();break;
    case 'add-book':openEditor();break;

    case 'settings':openSettings();break;
    case 'samples':loadSamples();break;
    case 'close':closeModal();break;
    case 'rename-shelf':{const sh=state.shelves.find(s=>s.id===sid);const n=prompt('Nombre del estante:',sh.name);if(n&&n.trim()){sh.name=n.trim();save();render()}break}
    case 'shelf-display':booksOn(sid).forEach(b=>b.display=a.dataset.d);save();render();break;
    case 'add-shelf':addShelf();break;
    case 'del-shelf':delShelf(sid);break;
    case 'set-status':{book.status=a.dataset.s;if(book.status==='leido'&&!book.endDate)book.endDate=today();if(book.status==='leyendo'&&!book.startDate)book.startDate=today();save();render();openDetail(book.id);break}
    case 'set-display':book.display=a.dataset.d;save();render();openDetail(book.id);break;
    case 'move':{const list=booksOn(book.shelfId);const i=list.indexOf(book),j=i+(+a.dataset.dir);if(j<0||j>=list.length)break;[list[i],list[j]]=[list[j],list[i]];setShelfOrder(book.shelfId,list);save();render();toast('Movido');break}
    case 'edit-book':openEditor(book.id);break;
    case 'del-book':if(confirm(`¿Eliminar «${book.title}» de tu biblioteca?`)){state.books=state.books.filter(b=>b!==book);save();closeModal();render();toast('Libro eliminado')}break;
    case 'osearch':onlineSearch();break;
    case 'pick-result':applyResult(ui.results[+a.dataset.i]);break;
    case 'pick-cover':draft.cover=draft._covers[+a.dataset.i];{const ci=$('[name=cover]');if(ci)ci.value=draft.cover}refreshImages();autoSpineColor();break;
    case 'upload':fileTarget=a.dataset.k;$('#fileIn').value='';$('#fileIn').click();break;
    case 'clear-img':draft[a.dataset.k]='';renderForm();break;
    case 'auto-color':draft._userColor=false;autoSpineColor(true);break;
    case 'form-status':draft.status=a.dataset.s;if(draft.status==='leido'&&!draft.endDate)draft.endDate=today();if(draft.status==='leyendo'&&!draft.startDate)draft.startDate=today();renderForm();break;
    case 'save-book':saveDraft();break;
    case 'theme':{const t=a.dataset.t;if(t==='custom'&&!state.settings.custom)state.settings.custom={...currentColors(),name:'Mi paleta'};state.settings.theme=t;applyTheme();save();render();openSettings();break}
    case 'wood':state.settings.wood=a.dataset.w;applyTheme();save();render();openSettings();break;
    case 'def-display':state.settings.defaultDisplay=a.dataset.d;save();openSettings();break;
    case 'export':{const blob=new Blob([JSON.stringify(state,null,1)],{type:'application/json'});const u=URL.createObjectURL(blob);const l=document.createElement('a');l.href=u;l.download=`mi-biblioteca-${today()}.json`;l.click();setTimeout(()=>URL.revokeObjectURL(u),2000);toast('Copia descargada');break}
    case 'import':$('#jsonIn').value='';$('#jsonIn').click();break;
    case 'import-xls':$('#xlsIn').value='';$('#xlsIn').click();break;
    case 'do-import':doImport();break;
    case 'enrich-all':{const ids=state.books.filter(b=>!b.cover||!b.synopsis||!b.spineColor).map(b=>b.id);
      if(!ids.length){toast('Todos tus libros tienen ya portada y sinopsis');break}
      closeModal();toast(`Busco lo que falta en ${ids.length} ${ids.length===1?'libro':'libros'}…`);Enrich.add(ids);break}
    case 'toggle-genre':toggleGenre(a.dataset.g);break;
    case 'add-genre':addGenreFromInput();break;
    case 'find-cover':findCoverForDraft();break;
    case 'cloud-connect':cloudConnect($('#cloudUrl').value,$('#cloudKey').value);break;
    case 'cloud-sync':Cloud.pull(true).then(()=>{if(Cloud.status==='ok')toast('Sincronizado')});break;
    case 'cloud-off':if(confirm('¿Desconectar este dispositivo de la nube? Tus libros siguen aquí y en tu Drive.')){Cloud.cfg=null;Cloud.saveCfg();Cloud.set('off');openSettings()}break;
    case 'cloud-link':{const link=location.origin+location.pathname+'#nube='+encodeURIComponent(btoa(JSON.stringify({u:Cloud.cfg.url,k:Cloud.cfg.key})));
      const out=$('#cloudLinkOut');out.value=link;out.hidden=false;out.select();
      try{await navigator.clipboard.writeText(link);toast('Enlace copiado. Ábrelo en tu otro dispositivo')}catch(err){toast('Copia el enlace que aparece debajo')}
      break}
    case 'wipe':if(confirm('¿Borrar TODOS los libros y ajustes? Si tienes la nube conectada, también se vaciará allí (en tu Drive quedan las copias diarias).')&&confirm('¿Seguro? No se puede deshacer (salvo que tengas una copia exportada).')){state=defaultState();applyTheme();save();closeModal();render();toast('Biblioteca vacía')}break;
  }
});
// estrellas
document.addEventListener('click',e=>{
  const st=e.target.closest('.stars.interactive .star');if(!st)return;
  const wrap=st.parentElement,r=st.getBoundingClientRect(),i=+st.dataset.i;
  let v=(e.clientX-r.left)<r.width/2?i-.5:i;if(v===+wrap.dataset.r)v=0;
  const t=wrap.dataset.target;wrap.dataset.r=v;paintStars(wrap,v);
  if(t==='draft'){if(draft)draft.rating=v}
  else{const b=byId(t);if(b){b.rating=v;save();render();const l=$('.rating-num');if(l)l.textContent=v?String(v).replace('.',',')+' / 5':'Sin valorar'}}
});
document.addEventListener('mousemove',e=>{
  const st=e.target.closest?.('.stars.interactive .star');if(!st)return;
  const r=st.getBoundingClientRect(),i=+st.dataset.i;paintStars(st.parentElement,(e.clientX-r.left)<r.width/2?i-.5:i);
});
document.addEventListener('mouseout',e=>{
  const w=e.target.closest?.('.stars.interactive');if(!w||w.contains(e.relatedTarget))return;paintStars(w,+w.dataset.r);
});
// campos
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='q'){ui.q=t.value;render();return}
  if(t.id==='setTitle'){state.settings.title=t.value;applyTheme();save();return}
  if(t.id==='setGkey'){state.settings.gkey=t.value.trim();save();return}
  if(t.dataset.color){const s=state.settings;s.custom={...currentColors(),name:'Mi paleta',[t.dataset.color]:t.value};s.theme='custom';applyTheme();save();$$('.tcard').forEach(c=>c.classList.toggle('on',c.dataset.t==='custom'));return}
  if(t.dataset.shelfname){const sh=state.shelves.find(s=>s.id===t.dataset.shelfname);if(sh){sh.name=t.value;save();render()}return}
  if(draft&&t.name&&t.closest('#formArea')){
    draft[t.name]=t.value;
    if(t.name==='spineColor')draft._userColor=true;
    if(['cover','spineImg','spineColor','title','author','pages','format'].includes(t.name))refreshImages();
  }
});
document.addEventListener('change',async e=>{
  const t=e.target;
  if(t.id==='fmtSel'){ui.fmt=t.value;render();return}
  if(t.id==='sortSel'){ui.sort=t.value;render();return}
  if(t.id==='genSel'){ui.genre=t.value;render();return}
  if(t.dataset.imp!==undefined||['impFmt','impSt','impShelf'].includes(t.id)){if(t.dataset.imp!==undefined)imp.map[t.dataset.imp]=t.value===''?null:+t.value;renderImpPreview();return}
  if(t.id==='xlsIn'&&t.files[0]){readSpreadsheet(t.files[0]);return}
  if(t.id==='dShelf'){const id=t.closest('[data-book]').dataset.book;moveBook(id,t.value,null);toast('Cambiado de estante');return}
  if(t.id==='dPage'){const id=t.closest('[data-book]').dataset.book;const b=byId(id);b.currentPage=t.value;save();render();openDetail(id);
    if(num(b.pages)&&num(t.value)>=num(b.pages))toast('¡Lo has terminado! Márcalo como leído ✓');return}
  if(t.id==='fileIn'&&t.files[0]&&draft){
    try{draft[fileTarget]=await fileToDataURL(t.files[0]);if(fileTarget==='cover'){draft._userColor=false}renderForm();if(fileTarget==='cover')autoSpineColor()}catch(err){toast('No he podido leer esa imagen')}return}
  if(t.id==='jsonIn'&&t.files[0]){
    try{const data=JSON.parse(await t.files[0].text());if(!Array.isArray(data.books)||!Array.isArray(data.shelves))throw 0;
      if(!confirm(`Esta copia tiene ${data.books.length} libros. ¿Reemplazar tu biblioteca actual?`))return;
      state=data;state.settings={...defaultState().settings,...data.settings};applyTheme();save();closeModal();render();toast('Biblioteca importada')}
    catch(err){toast('Ese archivo no parece una copia de Mi Biblioteca')}}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&$('#modalWrap').classList.contains('open'))closeModal();
  if(e.key==='Enter'&&e.target.id==='oq'){e.preventDefault();onlineSearch()}
  if(e.key==='Enter'&&e.target.id==='newGenre'){e.preventDefault();addGenreFromInput()}
});
let downOnBackdrop=false;
$('#modalWrap').addEventListener('mousedown',e=>downOnBackdrop=e.target.id==='modalWrap');
$('#modalWrap').addEventListener('click',e=>{if(e.target.id==='modalWrap'&&downOnBackdrop)closeModal()});

/* ---------- Arrastrar y soltar ---------- */
let dragId=null;
document.addEventListener('dragstart',e=>{const b=e.target.closest?.('.book[data-id]');if(!b)return;dragId=b.dataset.id;e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',dragId);setTimeout(()=>b.classList.add('dragging'))});
document.addEventListener('dragend',()=>{dragId=null;$$('.dragging,.drop-hover').forEach(x=>x.classList.remove('dragging','drop-hover'))});
document.addEventListener('dragover',e=>{
  if(!dragId)return;const row=e.target.closest?.('.shelf')?.querySelector('.shelf-row');if(!row)return;
  e.preventDefault();e.dataTransfer.dropEffect='move';
  $$('.drop-hover').forEach(x=>x!==row&&x.classList.remove('drop-hover'));row.classList.add('drop-hover');
});
document.addEventListener('drop',e=>{
  if(!dragId)return;const row=e.target.closest?.('.shelf')?.querySelector('.shelf-row');if(!row)return;e.preventDefault();
  const sid=row.dataset.shelf;let beforeId=null;
  const tb=e.target.closest('.book[data-id]');
  if(tb&&tb.dataset.id!==dragId){
    const r=tb.getBoundingClientRect();const inStack=!!tb.closest('.stack');
    const before=inStack?e.clientY<r.top+r.height/2:e.clientX<r.left+r.width/2;
    if(before)beforeId=tb.dataset.id;
    else{const list=booksOn(sid).filter(x=>x.id!==dragId);const k=list.findIndex(x=>x.id===tb.dataset.id);beforeId=list[k+1]?.id||null}
  }else if(!tb){
    for(const ch of row.children){const r=ch.getBoundingClientRect();if(r.left+r.width/2>e.clientX){const first=ch.matches('.book')?ch:ch.querySelector('.book');if(first&&first.dataset.id!==dragId){beforeId=first.dataset.id;break}}}
  }else return;
  moveBook(dragId,sid,beforeId);
});

/* ================= Nube (tu Google Drive vía Apps Script) ================= */
const errMsg=e=>!e?'error':(e.message==='Failed to fetch'||e.name==='TypeError')?'sin conexión a internet':e.message;
const Cloud={cfg:null,status:'off',msg:'',timer:null,busy:false,
  on(){return !!(this.cfg&&this.cfg.url&&this.cfg.key)},
  async load(){try{this.cfg=await DB.get('sync')}catch(e){this.cfg=null}this.set(this.on()?'ok':'off')},
  async saveCfg(){try{await DB.set('sync',this.cfg)}catch(e){}},
  set(s,m){this.status=s;this.msg=m||'';this.paint()},
  label(){
    if(!this.on())return 'No conectada';
    if(this.status==='busy')return 'Sincronizando…';
    if(this.status==='err')return 'No se ha podido sincronizar: '+this.msg+'. Lo reintentaré en el próximo cambio.';
    return 'Conectada · última sincronización: '+(this.cfg.last?new Date(this.cfg.last).toLocaleString('es-ES',{dateStyle:'short',timeStyle:'short'}):'nunca');
  },
  paint(){
    const b=$('#cloudBtn');if(b){b.hidden=!this.on();b.className='btn icon-btn cloud-'+this.status;b.title=this.label()}
    const s=$('#cloudStatus');if(s)s.textContent=this.label();
  },
  async get(){
    const r=await fetch(this.cfg.url+(this.cfg.url.includes('?')?'&':'?')+'key='+encodeURIComponent(this.cfg.key));
    const j=await r.json().catch(()=>{throw new Error('la dirección del script no es correcta')});
    if(!j.ok)throw new Error(j.error==='clave'?'la clave secreta no coincide':j.error||'error');
    return j.data;
  },
  async put(data){
    const r=await fetch(this.cfg.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({key:this.cfg.key,data})});
    const j=await r.json().catch(()=>{throw new Error('la dirección del script no es correcta')});
    if(!j.ok)throw new Error(j.error==='clave'?'la clave secreta no coincide':j.error||'error');
  },
  schedulePush(){if(!this.on())return;clearTimeout(this.timer);this.set('busy');this.timer=setTimeout(()=>this.push(),2500)},
  async push(){
    if(!this.on())return;
    try{this.set('busy');await this.put(state);this.cfg.last=Date.now();await this.saveCfg();this.set('ok')}
    catch(e){this.set('err',errMsg(e))}
  },
  async pull(){
    if(!this.on()||this.busy)return;this.busy=true;
    try{
      this.set('busy');const remote=await this.get();
      const rAt=remote?.updatedAt||0,lAt=state.updatedAt||0;
      if(remote&&Array.isArray(remote.books)&&rAt>lAt){adoptState(remote);toast('Biblioteca actualizada desde la nube')}
      else if(lAt>rAt)await this.put(state);
      this.cfg.last=Date.now();await this.saveCfg();this.set('ok');
    }catch(e){this.set('err',errMsg(e))}
    finally{this.busy=false}
  },
};
function adoptState(s){
  state=s;state.settings={...defaultState().settings,...s.settings};
  if(!state.shelves?.length)state.shelves=defaultState().shelves;
  DB.set('state',state).catch(()=>{});applyTheme();render();
}
async function cloudConnect(url,key){
  url=(url||'').trim();key=(key||'').trim();
  if(!/^https:\/\/script\.google(usercontent)?\.com\//.test(url)){toast('La dirección debe empezar por https://script.google.com/');return}
  if(!key){toast('Falta la clave secreta');return}
  Cloud.cfg={url,key};Cloud.set('busy');toast('Conectando con tu Google Drive…');
  try{
    const remote=await Cloud.get();
    const rN=remote?.books?.length||0,lN=state.books.length;
    let useCloud=rN>0&&lN===0;
    if(rN>0&&lN>0)useCloud=confirm(`En la nube hay ${rN} libros y en este dispositivo ${lN}.\n\nAceptar: quedarme con los de la nube (lo normal si ya la usabas en otro dispositivo).\nCancelar: subir a la nube los de este dispositivo.`);
    if(useCloud)adoptState(remote);
    else{if(!state.updatedAt)state.updatedAt=Date.now();await Cloud.put(state)}
    Cloud.cfg.last=Date.now();await Cloud.saveCfg();Cloud.set('ok');
    toast('Conectada a tu Google Drive');
  }catch(e){Cloud.cfg=null;Cloud.set('off');toast('No he podido conectar: '+errMsg(e))}
  if($('#modalWrap').classList.contains('open'))openSettings();
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')Cloud.pull()});
window.addEventListener('online',()=>{if(Cloud.status==='err')Cloud.push()});

/* ================= Inicio ================= */
(async function init(){
  try{await DB.open()}catch(e){DB.ls=true}
  try{state=await DB.get('state')}catch(e){state=null}
  if(!state||!Array.isArray(state.books))state=defaultState();
  state.settings={...defaultState().settings,...state.settings};
  if(!state.shelves?.length)state.shelves=defaultState().shelves;
  applyTheme();render();
  await Cloud.load();
  // Enlace de conexión desde otro dispositivo: …#nube=…
  if(location.hash.startsWith('#nube=')){
    try{const c=JSON.parse(atob(decodeURIComponent(location.hash.slice(6))));history.replaceState(null,'',location.pathname);await cloudConnect(c.u,c.k)}
    catch(e){toast('Ese enlace de conexión no es válido')}
  }else if(Cloud.on())Cloud.pull();
})();
</script>
